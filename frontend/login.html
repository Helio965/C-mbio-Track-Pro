<!doctype html>
<!-- =====================================================================
     TELA DE ACESSO (login.html): entrar ou criar conta.
     O comportamento do formulário está em js/login.js.
     ===================================================================== -->
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Acesso à carteira · CâmbioTrack Pro</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="css/style.css">
  <!-- Scripts do tipo module só rodam depois que a página foi carregada. -->
  <script src="js/login.js" type="module"></script>
</head>
<body class="auth-page">
  <header class="navbar">
    <h1 class="brand"><span class="brand-mark" aria-hidden="true">⇄</span> CâmbioTrack <span class="brand-pro">Pro</span></h1>
  </header>
  <main class="auth-main">
    <section class="auth-card form-section" aria-labelledby="titulo-acesso">
      <h2 id="titulo-acesso">Acessar minha carteira</h2>
      <p class="subtitle" id="descricao-acesso">Entre para consultar suas simulações de câmbio.</p>
      <!-- Um único formulário serve para login e cadastro. Nome e confirmação
           só aparecem (e só são obrigatórios) no modo cadastro. -->
      <form id="formulario-acesso">
        <fieldset id="campos-acesso">
          <legend class="sr-only">Dados de acesso</legend>
          <div class="input-group" id="grupo-nome" hidden>
            <label for="nome">Nome</label>
            <input id="nome" name="nome" autocomplete="name" maxlength="100" disabled>
          </div>
          <div class="input-group">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="username" required maxlength="254" placeholder="seu@email.com">
          </div>
          <div class="input-group">
            <label for="senha">Senha</label>
            <input id="senha" name="senha" type="password" autocomplete="current-password" required>
            <p class="ajuda" id="ajuda-senha" hidden>Use pelo menos 8 caracteres.</p>
          </div>
          <div class="input-group" id="grupo-confirmacao" hidden>
            <label for="confirmacao">Confirme a senha</label>
            <input id="confirmacao" name="confirmacao" type="password" autocomplete="new-password" disabled>
          </div>
          <!-- Mensagens de carregamento, erro e sucesso; role="status" é lido por leitores de tela. -->
          <p id="mensagem-acesso" class="mensagem-operacao" role="status"></p>
          <button id="entrar" class="btn-primary" type="submit">Entrar</button>
        </fieldset>
      </form>
      <!-- Alterna entre os modos "Entrar" e "Criar conta". -->
      <div class="auth-switch">
        <span id="pergunta-modo">Primeiro acesso?</span>
        <button id="alternar-modo" class="link-button" type="button">Criar conta</button>
      </div>
    </section>
    <noscript>Ative o JavaScript para acessar a carteira.</noscript>
  </main>
  <footer class="footer">CâmbioTrack Pro · Projeto 02 · Desenvolvimento Web</footer>
</body>
</html>
